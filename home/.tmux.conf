# ─── Prefix ───────────────────────────────────────────────────────────────────
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# ─── Mouse & Terminal ─────────────────────────────────────────────────────────
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -ga terminal-overrides ",*256col*:Tc"

# Undercurl + colored underlines (nvim LSP diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d%;m'

# ─── Responsiveness ───────────────────────────────────────────────────────────
set -s escape-time 10
set -g focus-events on
set -g repeat-time 600
set -g display-time 4000
set -g display-panes-time 2000
set -g status-interval 5
setw -g aggressive-resize on
set -g status-keys emacs

# ─── History & Numbering ──────────────────────────────────────────────────────
set -g history-limit 50000
set -g base-index 1
set -wg pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# ─── Copy Mode (vi) ───────────────────────────────────────────────────────────
set -wg mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ─── Clipboard (OSC 52; works on WSL2 and macOS terminals) ────────────────────
set -s set-clipboard on
set -as terminal-features ',*:clipboard'

# ─── Splits / New Windows (inherit cwd) ───────────────────────────────────────
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# ─── Pane Navigation (vim-style) ──────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane Resizing (repeatable) ───────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Window Management ────────────────────────────────────────────────────────
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1
bind C-s choose-tree -Zs
bind C-w choose-tree -Zw
bind b break-pane -d

# ─── Reload Config ────────────────────────────────────────────────────────────
bind R source ~/.tmux.conf \; display "Config reloaded!"

# ─── Status Bar ───────────────────────────────────────────────────────────────
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=white"
set -g status-left-length 40
set -g status-left "#[fg=green,bold] #S #[fg=brightblack]│ "
set -g status-right-length 80
set -g status-right "#{prefix_highlight}#[fg=brightblack]│ #[fg=cyan]#h #[fg=brightblack]│ #[fg=yellow]%H:%M "
set -g window-status-current-format "#[fg=black,bg=blue,bold] #I:#W "
set -g window-status-format "#[fg=white] #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=blue,fg=black"

%if #{>=:#{version},3.2}
set -g extended-keys on
%endif

# ─── Plugins (TPM) ────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'laktak/extrakto'

# Plugin config
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @yank_action 'copy-pipe'

# Init TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
